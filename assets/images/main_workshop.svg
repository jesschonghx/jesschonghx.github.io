<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067">
  <!-- Lavender wash reused from the CapitalView case study -->
  <rect width="1600" height="1067" fill="#edebf5"/>

  <text x="800" y="150" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#282828">Renewal Pricing Discovery Workshop</text>
  <text x="800" y="205" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#646464">AIA · five markets · one ideal workflow</text>

  <!-- Five market sticky notes, one per case-study pastel -->
  <!-- Singapore: mint -->
  <g transform="rotate(-6 250 405)">
    <rect x="155" y="330" width="190" height="150" rx="14" fill="#d8f0f0" stroke="#282828" stroke-width="2.5"/>
    <rect x="220" y="322" width="60" height="18" rx="4" fill="#ffffff" opacity="0.75"/>
    <text x="250" y="392" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#282828">SG</text>
    <text x="250" y="420" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#646464">Singapore</text>
    <line x1="210" y1="442" x2="290" y2="442" stroke="#282828" stroke-width="1.5" opacity="0.35"/>
  </g>
  <!-- Malaysia: site cream -->
  <g transform="rotate(4 235 610)">
    <rect x="140" y="535" width="190" height="150" rx="14" fill="#f5f0e7" stroke="#282828" stroke-width="2.5"/>
    <rect x="205" y="527" width="60" height="18" rx="4" fill="#ffffff" opacity="0.75"/>
    <text x="235" y="597" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#282828">MY</text>
    <text x="235" y="625" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#646464">Malaysia</text>
    <line x1="195" y1="647" x2="275" y2="647" stroke="#282828" stroke-width="1.5" opacity="0.35"/>
  </g>
  <!-- Hong Kong: teal -->
  <g transform="rotate(-4 255 820)">
    <rect x="160" y="745" width="190" height="150" rx="14" fill="#c0d8d8" stroke="#282828" stroke-width="2.5"/>
    <rect x="225" y="737" width="60" height="18" rx="4" fill="#ffffff" opacity="0.75"/>
    <text x="255" y="807" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#282828">HK</text>
    <text x="255" y="835" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#646464">Hong Kong</text>
    <line x1="215" y1="857" x2="295" y2="857" stroke="#282828" stroke-width="1.5" opacity="0.35"/>
  </g>
  <!-- Thailand: green -->
  <g transform="rotate(5 480 470)">
    <rect x="385" y="395" width="190" height="150" rx="14" fill="#d8f0d8" stroke="#282828" stroke-width="2.5"/>
    <rect x="450" y="387" width="60" height="18" rx="4" fill="#ffffff" opacity="0.75"/>
    <text x="480" y="457" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#282828">TH</text>
    <text x="480" y="485" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#646464">Thailand</text>
    <line x1="440" y1="507" x2="520" y2="507" stroke="#282828" stroke-width="1.5" opacity="0.35"/>
  </g>
  <!-- Group Corporate Solutions: warm sand -->
  <g transform="rotate(-3 490 740)">
    <rect x="395" y="665" width="190" height="150" rx="14" fill="#e8d8c8" stroke="#282828" stroke-width="2.5"/>
    <rect x="460" y="657" width="60" height="18" rx="4" fill="#ffffff" opacity="0.75"/>
    <text x="490" y="727" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#282828">GCS</text>
    <text x="490" y="755" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#646464">Group</text>
    <line x1="450" y1="777" x2="530" y2="777" stroke="#282828" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- Dashed convergence lines into the board -->
  <g stroke="#282828" stroke-width="2.5" fill="none" opacity="0.5" stroke-dasharray="12 9" stroke-linecap="round">
    <path d="M 350 405 C 560 405 640 470 748 480"/>
    <path d="M 335 610 C 560 610 640 570 748 555"/>
    <path d="M 355 820 C 560 820 640 680 748 635"/>
    <path d="M 580 470 C 660 470 700 495 748 505"/>
    <path d="M 590 740 C 660 740 700 620 748 590"/>
  </g>
  <g fill="#282828" opacity="0.6">
    <circle cx="752" cy="480" r="5"/>
    <circle cx="752" cy="555" r="5"/>
    <circle cx="752" cy="635" r="5"/>
    <circle cx="752" cy="505" r="5"/>
    <circle cx="752" cy="590" r="5"/>
  </g>

  <!-- One ideal workflow board -->
  <rect x="760" y="330" width="690" height="550" rx="26" fill="#ffffff" stroke="#282828" stroke-width="3"/>
  <text x="1105" y="398" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#282828">One ideal workflow</text>
  <line x1="820" y1="424" x2="1390" y2="424" stroke="#646464" stroke-width="1.5" opacity="0.35"/>

  <!-- Stage pills: row 1 -->
  <g font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#282828" text-anchor="middle">
    <rect x="785" y="463" width="170" height="54" rx="27" fill="#f7f3ee" stroke="#282828" stroke-width="2"/>
    <text x="870" y="498">Start</text>
    <rect x="1020" y="463" width="170" height="54" rx="27" fill="#f7f3ee" stroke="#282828" stroke-width="2"/>
    <text x="1105" y="498">Gather</text>
    <rect x="1255" y="463" width="170" height="54" rx="27" fill="#f7f3ee" stroke="#282828" stroke-width="2"/>
    <text x="1340" y="498">Analyse</text>
    <rect x="785" y="633" width="170" height="54" rx="27" fill="#f7f3ee" stroke="#282828" stroke-width="2"/>
    <text x="870" y="668">Decide</text>
    <rect x="1020" y="633" width="170" height="54" rx="27" fill="#f7f3ee" stroke="#282828" stroke-width="2"/>
    <text x="1105" y="668">Share</text>
    <rect x="1255" y="633" width="170" height="54" rx="27" fill="#f7f3ee" stroke="#282828" stroke-width="2"/>
    <text x="1340" y="668">Negotiate</text>
  </g>

  <!-- Row arrows -->
  <g stroke="#282828" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 963 490 L 1010 490 M 1000 482 L 1010 490 L 1000 498"/>
    <path d="M 1198 490 L 1245 490 M 1235 482 L 1245 490 L 1235 498"/>
    <path d="M 963 660 L 1010 660 M 1000 652 L 1010 660 L 1000 668"/>
    <path d="M 1198 660 L 1245 660 M 1235 652 L 1245 660 L 1235 668"/>
  </g>

  <!-- Snake connector: Analyse down to Decide -->
  <path d="M 1400 522 C 1390 585 960 585 880 628" stroke="#282828" stroke-width="2.5" fill="none" opacity="0.5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <path d="M 872 616 L 880 628 L 892 624" stroke="#282828" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1105" y="822" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#646464">co-designed by all five markets</text>
</svg>
